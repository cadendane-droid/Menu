<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GameForAll</title>
<style>
  :root {
    --bg: #0f1218; --panel: #171c26; --panel-2: #1f2633; --line: #2b3444;
    --text: #e8ecf3; --muted: #8b95a7; --accent: #7c8cff; --x: #4fc3f7; --o: #ffb74d;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; }
  body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 24px 16px; padding-top: calc(24px + env(safe-area-inset-top, 0px)); }
  header { text-align: center; margin-bottom: 20px; }
  h1 { font-size: 2rem; margin: 0 0 6px; letter-spacing: .3px; }
  p { color: var(--muted); margin: 6px 0; line-height: 1.45; }
  a { color: var(--accent); text-decoration: none; }
  button { font: inherit; cursor: pointer; border: 0; border-radius: 10px; padding: 12px 18px; font-weight: 600; background: var(--accent); color: white; }
  button:hover { filter: brightness(1.1); }
  input[type=text] { font: inherit; width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2); color: var(--text); outline: none; }
  input[type=text]:focus { border-color: var(--accent); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 22px; width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 12px; }
  .games { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; width: 100%; max-width: 820px; }
  .game { display: flex; flex-direction: column; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; color: var(--text); transition: transform .1s, border-color .15s; }
  .game:hover { transform: translateY(-2px); border-color: var(--accent); }
  .game .art { height: 110px; border-radius: 10px; background: var(--panel-2); display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 900; font-size: 2.4rem; }
  .game h2 { margin: 0; font-size: 1.15rem; }
  .game p { margin: 0; font-size: .9rem; }
  .game .meta { display: flex; gap: 8px; flex-wrap: wrap; }
  .tag { padding: 2px 8px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--line); font-size: .75rem; color: var(--muted); }
  .game.soon { opacity: .5; pointer-events: none; }
  .X { color: var(--x); } .O { color: var(--o); }
  footer { margin-top: auto; padding-top: 24px; font-size: .85rem; }
</style>
</head>
<body>

<header>
  <h1>GameForAll</h1>
  <p id="greeting"></p>
</header>

<!-- ===== Name prompt (shown once) ===== -->
<section id="screen-name" class="card" hidden>
  <h2 style="margin:0">What should we call you?</h2>
  <p>Your name is shown to the people you play with.</p>
  <input id="name-input" type="text" maxlength="20" placeholder="Your name" autocomplete="off">
  <button id="name-save">Continue</button>
</section>

<!-- ===== Game list ===== -->
<section id="screen-games" class="games" hidden>
  <!--
    To add a game: copy one <a class="game"> block and point href at the
    game's site. Links are relative, so on GitHub Pages "../UltimateTTT/"
    resolves to https://<you>.github.io/UltimateTTT/ with no username needed.
  -->
  <a class="game" href="../UltimateTTT/">
    <div class="art"><span class="X">X</span><span class="O">O</span><span class="X">X</span></div>
    <h2>Ultimate Tic Tac Toe</h2>
    <p>Nine boards in one. Every move decides where your opponent plays next.</p>
    <div class="meta"><span class="tag">2 players</span><span class="tag">online</span></div>
  </a>
  <div class="game soon">
    <div class="art">?</div>
    <h2>More coming soon</h2>
    <p>New games will appear here.</p>
  </div>
</section>

<footer><a href="#" id="change-name">Change your name</a></footer>

<script>
const NAME_KEY = 'gameforall.playerName';   // the games read this same key
const $ = id => document.getElementById(id);
function loadName() { try { return localStorage.getItem(NAME_KEY) || ''; } catch { return ''; } }
function saveName(n) { try { localStorage.setItem(NAME_KEY, n); } catch {} }

function showGames(name) {
  $('greeting').textContent = 'Welcome, ' + name + '. Pick a game.';
  $('screen-name').hidden = true;
  $('screen-games').hidden = false;
}
function askName(current) {
  $('greeting').textContent = 'Pick a name to get started.';
  $('name-input').value = current || '';
  $('screen-games').hidden = true;
  $('screen-name').hidden = false;
  $('name-input').focus();
}
$('name-save').onclick = () => {
  const n = $('name-input').value.trim();
  if (!n) { $('name-input').focus(); return; }
  saveName(n); showGames(n);
};
$('name-input').addEventListener('keydown', e => { if (e.key === 'Enter') $('name-save').click(); });
$('change-name').onclick = e => { e.preventDefault(); askName(loadName()); };

const existing = loadName();
if (existing) showGames(existing); else askName('');
</script>
</body>
</html>
